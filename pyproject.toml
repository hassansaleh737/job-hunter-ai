[project]
name = "job-hunter-ai"
version = "0.1.0"
description = "Evidence-based remote job matching agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.57,<2",
  "pymupdf>=1.26,<2",
  "pydantic>=2.9,<3",
  "huggingface-hub>=1.25,<2",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5", "respx>=0.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
